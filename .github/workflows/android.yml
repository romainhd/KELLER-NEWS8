name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP entpacken
        run: |
          unzip -q *.zip
          ls

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhaengigkeiten
        working-directory: keller-news
        run: npm install

      - name: Android-Projekt erzeugen
        working-directory: keller-news
        run: npx expo prebuild --platform android --no-install

      - name: Bauen
        working-directory: keller-news
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: keller-news-apk
          path: keller-news/android/app/build/outputs/apk/debug/app-debug.apk
